<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>મંગલેશ્વર બેકરી & પટેલ ફાસ્ટ ફૂડ - હિસાબ કિતાબ</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; background: #27ae60; color: white; border: none; padding: 12px; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        button:hover { background: #219653; }
        .btn-secondary { background: #2980b9; }
        .btn-secondary:hover { background: #1f618d; }
        .btn-danger { background: #c0392b; margin-top: 15px; }
        .btn-danger:hover { background: #962d22; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #3498db; color: white; }
        .hidden { display: none; }
        .link-text { text-align: center; margin-top: 10px; color: #3498db; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <!-- LOGIN SECTION -->
    <div id="loginSection">
        <h2>🔐 એડમિન લોગિન</h2>
        <p style="text-align: center; color: #7f8c8d;">મંગલેશ્વર બેકરી & પટેલ ફાસ્ટ ફૂડ</p>
        
        <div class="form-group">
            <label>ઈમેઈલ આઈડી (Email):</label>
            <input type="email" id="loginEmail" placeholder="તમારો ઈમેઈલ નાખો">
        </div>
        <div class="form-group">
            <label>પાસવર્ડ (Password):</label>
            <input type="password" id="loginPassword" placeholder="પાસવર્ડ નાખો">
        </div>
        
        <button onclick="handleLogin()">લોગિન કરો</button>
        <div class="link-text" onclick="showForgot()">પાસવર્ડ ભૂલી ગયા છો?</div>
    </div>

    <!-- FORGOT PASSWORD SECTION -->
    <div id="forgotSection" class="hidden">
        <h2>🔄 પાસવર્ડ રીસેટ કરો</h2>
        <div class="form-group">
            <label>રજિસ્ટર્ડ ઈમેઈલ આઈડી:</label>
            <input type="email" id="forgotEmail" placeholder="તમારો ઈમેઈલ નાખો">
        </div>
        <button class="btn-secondary" onclick="handleForgot()">રિસેટ લિંક મોકલો</button>
        <div class="link-text" onclick="showLogin()">પાછા લોગિન પર જાઓ</div>
    </div>

    <!-- MAIN APP SECTION -->
    <div id="appSection" class="hidden">
        <h2>🏪 મંગલેશ્વર બેકરી & પટેલ ફાસ્ટ ફૂડ</h2>
        <p style="text-align: center; color: #7f8c8d; font-size: 14px;">દૈનિક વકરો અને ખર્ચ મેનેજર</p>

        <div class="form-group">
            <label>તારીખ (Date):</label>
            <input type="date" id="entryDate">
        </div>
        <div class="form-group">
            <label>રોકડ વેચાણ - Cash Sales (₹):</label>
            <input type="number" id="cashSales" value="0">
        </div>
        <div class="form-group">
            <label>ઓનલાઈન પેમેન્ટ - Online Payment (₹):</label>
            <input type="number" id="onlineSales" value="0">
        </div>
        <div class="form-group">
            <label>દૈનિક ખર્ચો - Daily Expense (₹):</label>
            <input type="number" id="expense" value="0">
        </div>
        <div class="form-group">
            <label>ખર્ચની વિગત (Expense Reason):</label>
            <input type="text" id="expenseDesc" placeholder="કોઈ ખર્ચ હોય તો લખો...">
        </div>

        <button onclick="saveEntry()">એન્ટ્રી સેવ કરો</button>

        <h3 style="margin-top: 25px;">📋 નોંધાયેલા હિસાબો</h3>
        <table id="accountTable">
            <thead>
                <tr>
                    <th>તારીખ</th>
                    <th>રોકડ</th>
                    <th>ઓનલાઈન</th>
                    <th>ખર્ચ</th>
                    <th>ચોખ્ખી આવક</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <button class="btn-secondary" style="margin-top: 15px;" onclick="exportToCSV()">📊 Excel ડાઉનલોડ કરો</button>
        <button class="btn-danger" onclick="handleLogout()">લૉગ આઉટ</button>
    </div>
</div>

<script>
    document.getElementById('entryDate').valueAsDate = new Date();

    function handleLogin() {
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPassword').value;
        if(email && pass) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            loadData();
        } else {
            alert('કૃપયા ઈમેઈલ અને પાસવર્ડ બંને દાખલ કરો.');
        }
    }

    function showForgot() {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('forgotSection').classList.remove('hidden');
    }

    function showLogin() {
        document.getElementById('forgotSection').classList.add('hidden');
        document.getElementById('loginSection').classList.remove('hidden');
    }

    function handleForgot() {
        const email = document.getElementById('forgotEmail').value;
        if(email) {
            alert('પાસવર્ડ રીસેટ કરવાની લિંક તમારા ઈમેઈલ પર મોકલી દેવામાં આવી છે!');
            showLogin();
        } else {
            alert('કૃપયા સાચો ઈમેઈલ નાખો.');
        }
    }

    function handleLogout() {
        document.getElementById('appSection').classList.add('hidden');
        document.getElementById('loginSection').classList.remove('hidden');
    }

    let entries = JSON.parse(localStorage.getItem('mangleshwarEntries')) || [];

    function saveEntry() {
        const date = document.getElementById('entryDate').value;
        const cash = parseFloat(document.getElementById('cashSales').value) || 0;
        const online = parseFloat(document.getElementById('onlineSales').value) || 0;
        const exp = parseFloat(document.getElementById('expense').value) || 0;
        const desc = document.getElementById('expenseDesc').value || 'કોઈ નહીં';

        if(!date) {
            alert('કૃપયા તારીખ પસંદ કરો!');
            return;
        }

        const total = cash + online;
        const net = cash - exp;

        const newRow = { date, cash, online, exp, total, net, desc };
        entries.unshift(newRow);
        localStorage.setItem('mangleshwarEntries', JSON.stringify(entries));

        loadData();
        alert('✅ એન્ટ્રી સફળતાપૂર્વક સેવ થઈ ગઈ!');
        
        document.getElementById('cashSales').value = '0';
        document.getElementById('onlineSales').value = '0';
        document.getElementById('expense').value = '0';
        document.getElementById('expenseDesc').value = '';
    }

    function loadData() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        entries.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.date}</td>
                <td>₹${item.cash}</td>
                <td>₹${item.online}</td>
                <td>₹${item.exp}</td>
                <td><b>₹${item.net}</b></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function exportToCSV() {
        if(entries.length === 0) {
            alert('ડાઉનલોડ કરવા માટે કોઈ ડેટા નથી!');
            return;
        }
        let csvContent = "data:text/csv;charset=utf-8,Date,Cash Sales,Online Payment,Expense,Net Cash\n";
        entries.forEach(e => {
            csvContent += `${e.date},${e.cash},${e.online},${e.exp},${e.net}\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "Mangleshwar_Bakery_Accounts.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
